server:
  port: ${PORT:8080}

spring:
  application:
    name: krishisetu-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/krishisetu}
    username: ${SPRING_DATASOURCE_USERNAME:krishisetu_user}
    password: ${SPRING_DATASOURCE_PASSWORD:change_this_local_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

krishisetu:
  jwt:
    # Provide a 256-bit+ Base64 secret in production via JWT_SECRET_KEY
    secret: ${JWT_SECRET_KEY:S3Jpc2hpU2V0dVBoYXNlMVRlbXBEZXZTYWx0U2VjcmV0S2V5MjAyNg==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  seed:
    enabled: ${SEED_DEMO_DATA:true}
  plant-health:
    inference-url: ${PLANT_DISEASE_INFERENCE_URL:}
    inference-api-key: ${PLANT_DISEASE_INFERENCE_API_KEY:}

